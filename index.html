<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pets Date</title>
<link rel="icon" href="pets-date-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2118;--bg:#fdf3dc;--card:#fffaf0;--pri:#f28c28;--sec:#3fbfc4;--red:#e5484d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(rgba(43,33,24,.09) 1.2px,transparent 1.2px) 0 0/18px 18px var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2.5px solid var(--ink);padding-top:env(safe-area-inset-top,0)}
.bar{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px}
.logo{display:flex;align-items:center;gap:8px;font-size:1.5rem;font-weight:700;color:var(--ink);text-decoration:none}
.logo img{width:44px;height:44px}.logo span,h1 span{color:var(--pri)}
nav{display:flex;gap:8px;align-items:center}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}
.btn{display:inline-block;background:var(--pri);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
.btn.o{background:var(--card)}.btn.r{background:var(--red);color:#fff}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:16px;margin:0 0 16px;box-shadow:4px 4px 0 var(--ink)}
.narrow{max-width:440px;margin:20px auto}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;margin:0 0 10px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:10px}.chk input{width:auto;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:center;padding-top:10px}
h1{font-size:clamp(2.4rem,8vw,4rem);margin:0 0 10px}
.pic{position:relative;width:min(92vw,448px);margin:auto}
.burst{position:absolute;inset:5.4%;background:var(--sec);clip-path:polygon(50% 0%,61% 18%,82% 8%,78% 30%,100% 35%,82% 50%,100% 65%,78% 70%,82% 92%,61% 82%,50% 100%,39% 82%,18% 92%,22% 70%,0% 65%,18% 50%,0% 35%,22% 30%,18% 8%,39% 18%)}
.pic img{position:relative;display:block;width:100%;filter:drop-shadow(0 20px 13px rgba(0,0,0,.12));animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.pic img{animation:none}}
.lost{display:block;background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px;text-align:center;font-weight:700;margin-bottom:14px}
small{opacity:.7;font-weight:400}
.foot{text-align:center;font-weight:700;margin:0;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal .card{max-width:380px;width:100%;text-align:center;margin:0}.modal svg{width:100%;height:auto;max-width:280px}
.url{word-break:break-all;font-size:.8rem;background:#fff;border:2px dashed var(--ink);border-radius:8px;padding:6px}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #0002;padding:4px;text-align:left;font-size:.9rem}
@media print{body *{visibility:hidden}.modal,.modal *{visibility:visible}.modal{background:#fff;position:absolute}.row{display:none}}
.disp,h1,h2,h3,.btn,.logo{font-family:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif}
.sec{margin:56px 0 0}.sec>h2{font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 18px}
.pill{display:inline-block;background:#f7d44c;border:2.5px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:700;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg);margin-bottom:16px}
h1 .out{-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.lead{font-size:1.1rem;line-height:1.6;max-width:34em}
.btn.big{padding:12px 22px;font-size:1.05rem}
.feat h3,.step h3{margin:12px 0 6px}.feat p,.step p{margin:0;line-height:1.5}
.ico,.num{display:inline-flex;width:56px;height:56px;border-radius:50%;background:var(--pri);border:2.5px solid var(--ink);align-items:center;justify-content:center;font:700 1.4rem "Fredoka",sans-serif}
.plan ul{padding-left:20px;line-height:1.8;margin:8px 0 0}.no{opacity:.65}.price{margin:8px 0}.price b{font:700 2.4rem 'Fredoka',sans-serif}.pdesc{margin:4px 0;line-height:1.5}
.note{background:#fff;border:2.5px dashed var(--ink);border-radius:14px;padding:14px;line-height:1.5}
details.card{padding:0}summary{cursor:pointer;font-weight:700;padding:16px}details p{padding:0 16px 16px;margin:0;line-height:1.5}
label{display:block;font-weight:600;margin-bottom:4px}label input{margin-top:4px;font-weight:400}
.wide{width:100%;text-align:center}.or{text-align:center;margin:12px 0}.narrow.big{padding:28px}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#/"><img src="pets-date-logo.png" alt="Pets Date">Pets <span>Date</span></a><nav id="nav"></nav></div></header>
<main id="app"></main>
<footer class="foot">App desarrollada por Vidriera Digital<br>Todos los derechos reservados · Buenos Aires, Argentina · 2026<br><a href="#/privacidad" style="color:inherit">Privacidad y términos</a></footer>

<script>
// Muestra en pantalla cualquier error (sirve para diagnosticar)
function showErr(m) { var a = document.getElementById('app'); if (a) a.insertAdjacentHTML('afterbegin', '<div class="card"><b>Error:</b> ' + String(m).replace(/</g, '&lt;') + '</div>'); }
addEventListener('error', function (e) { if (e.target && e.target !== window) return; showErr(e.message || 'Error desconocido'); }, true);
addEventListener('unhandledrejection', function (e) { showErr((e.reason && e.reason.message) || e.reason); });
setTimeout(function () { var a = document.getElementById('app'); if (a && !a.innerHTML.trim()) showErr('La app no arrancó. Etapa: ' + (window.__st || 'ninguna') + ' · supabase: ' + typeof window.supabase + ' · qrcode: ' + typeof window.qrcode); }, 6000);
</script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// Tus datos (Supabase, WhatsApp, Google) están en config.js

if (typeof SUPABASE_URL === 'undefined' || SUPABASE_URL.startsWith('PEGA_') || SUPABASE_KEY.startsWith('PEGA_')) {
  document.getElementById('app').innerHTML = '<div class="card narrow"><h2>Falta configurar Supabase</h2><p>Revisa el archivo config.js: falta tu Project URL y tu clave de Supabase.</p></div>';
  throw new Error('Falta configurar Supabase');
}
// lock sin navigator.locks: evita que la sesión se quede esperando entre pestañas
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (n, t, fn) => fn() } });
window.__st = 'cliente';
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { window.__rec = true; setTimeout(route, 0); } });
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user = null;
let actx = null;
function beep() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); [0, .35, .7].forEach(t => { const o = actx.createOscillator(); o.frequency.value = 880; o.connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .25); }); } catch (e) {} }
async function alarm(s) {
  const { data: p } = await sb.from('pets').select('name').eq('id', s.pet_id).maybeSingle();
  beep(); navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 800]);
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="card"><h2>🚨 ¡Encontraron a ${esc(p?.name || 'tu mascota')}!</h2><p>${esc(s.message)}</p><p><b>Contacto:</b> ${esc(s.contact) || 'no dejó'}</p><div class="row">${s.lat ? `<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${s.lat},${s.lng}">Abrir en Google Maps</a>` : ''}<button class="btn o" id="ax">Cerrar</button></div></div>`;
  document.body.append(d);
  d.querySelector('#ax').onclick = () => { d.remove(); if (location.hash === '#/dashboard') dash(); };
}
function shrink(f) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => { const k = Math.min(1, 800 / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); c.toBlob(b => b ? ok(b) : no(new Error('No se pudo procesar la imagen')), 'image/jpeg', .85); }; i.onerror = () => no(new Error('Imagen no válida')); i.src = URL.createObjectURL(f); }); }

async function route() {
  const { data: { session } } = await Promise.race([sb.auth.getSession(), new Promise(r => setTimeout(() => r({ data: { session: null } }), 5000))]);
  window.__st = 'sesion';
  user = session?.user || null;
  let isAdmin = false; window.me = {}; window.isVet = false;
  if (user) {
    const [{ data: rl }, { data: m }] = await Promise.all([sb.from('user_roles').select('role').eq('user_id', user.id), sb.from('profiles').select('plan,blocked,wants_vet').eq('id', user.id).maybeSingle()]);
    isAdmin = !!rl?.some(r => r.role === 'admin'); window.isVet = !!rl?.some(r => r.role === 'vet'); window.me = m || {};
  }
  window.isAdmin = isAdmin;
  if (user && window.me.plan === 'pro' && !window.__sub) window.__sub = sb.channel('sg').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sightings' }, e => alarm(e.new)).subscribe();
  if (!user && window.__sub) { sb.removeChannel(window.__sub); window.__sub = null; }
  $('#nav').innerHTML = user
    ? '<a class="btn o" href="#/dashboard">Mis mascotas</a>' + (isAdmin ? '<a class="btn o" href="#/admin">Admin</a>' : '') + '<button class="btn o" id="out">Salir</button>'
    : '<a class="btn" href="#/auth">Ingresar</a>';
  if ($('#out')) $('#out').onclick = async () => { await sb.auth.signOut(); location.hash = '#/auth'; route(); };
  if (window.__rec) return newPassPage();
  const h = location.hash.slice(1) || '/';
  if (h.startsWith('/pet/')) return petPage(decodeURIComponent(h.slice(5)));
  ({ '/': home, '/auth': () => authPage('in'), '/dashboard': dash, '/admin': admin, '/veterinario': vetSignup, '/olvide': forgotPage, '/registro': () => authPage('up'), '/privacidad': privacyPage }[h] || home)();
}

let tab = 'free';
async function admin() {
  if (!window.isAdmin) { app.innerHTML = '<div class="card narrow"><h2>Solo para administradores</h2></div>'; return; }
  const [{ data: ps }, { data: rs }, { data: pets }] = await Promise.all([
    sb.from('profiles').select('id,full_name,phone,wants_vet,vet_license,clinic,plan,blocked,created_at').order('created_at', { ascending: false }),
    sb.from('user_roles').select('user_id,role'),
    sb.from('pets').select('id,name,species,tag_code,owner_id,created_at').order('created_at', { ascending: false })]);
  const vets = new Set((rs || []).filter(r => r.role === 'vet').map(r => r.user_id));
  const nm = Object.fromEntries(ps.map(p => [p.id, p.full_name || '(sin nombre)']));
  const owners = ps.filter(p => !p.wants_vet);
  const lists = { free: owners.filter(p => p.plan !== 'pro'), pro: owners.filter(p => p.plan === 'pro'), vet: ps.filter(p => p.wants_vet), qr: pets || [] };
  const titles = { free: 'Gratis', pro: 'Pro', vet: 'Veterinarios', qr: 'Mascotas / QR' };
  const first = tab === 'vet'
    ? p => vets.has(p.id) ? `<button class="btn o" data-rm="${p.id}">Quitar vet</button>` : `<button class="btn" data-ok="${p.id}">Aprobar vet</button>`
    : p => `<button class="btn ${p.plan === 'pro' ? 'o' : ''}" data-plan="${p.plan === 'pro' ? 'free' : 'pro'}" data-id="${p.id}">${p.plan === 'pro' ? 'Pasar a gratis' : 'Activar Pro'}</button>`;
  const btns = p => `${first(p)}<button class="btn o" data-blk="${p.blocked ? 0 : 1}" data-id="${p.id}">${p.blocked ? 'Desbloquear' : 'Bloquear'}</button>
    ${p.id === user.id ? '<small>(tú)</small>' : `<button class="btn r" data-del="${p.id}" data-n="${esc(p.full_name)}">Eliminar</button>`}`;
  const d = x => new Date(x).toLocaleDateString();
  const body = tab === 'qr'
    ? `<tr><th>Mascota</th><th>Dueño</th><th>Alta</th><th></th></tr>${lists.qr.map(p => `<tr><td>${esc(p.name)} <small>${esc(p.species)}</small>${Date.now() - new Date(p.created_at) < 172800000 ? ' <b>🆕 Nuevo</b>' : ''}</td><td>${esc(nm[p.owner_id])}</td><td>${d(p.created_at)}</td><td><button class="btn" data-qr="${p.tag_code}" data-n="${esc(p.name)}">QR / NFC</button></td></tr>`).join('')}`
    : `<tr><th>Nombre</th><th>Teléfono</th>${tab === 'vet' ? '<th>Matrícula · Clínica</th>' : ''}<th>Alta</th><th></th></tr>${lists[tab].map(p => `<tr><td>${esc(p.full_name) || '(sin nombre)'}${p.blocked ? ' 🚫' : ''}${tab === 'vet' ? (vets.has(p.id) ? ' ✅' : ' ⏳') : ''}</td><td>${esc(p.phone)}</td>${tab === 'vet' ? `<td>${esc(p.vet_license)} · ${esc(p.clinic)}</td>` : ''}<td>${d(p.created_at)}</td><td><div class="row" style="margin:0">${btns(p)}</div></td></tr>`).join('')}`;
  app.innerHTML = `<h2>Panel de administrador</h2><div class="row" style="margin:0 0 14px">${Object.keys(titles).map(k => `<button class="btn ${k === tab ? '' : 'o'}" data-tab="${k}">${titles[k]} (${lists[k].length})</button>`).join('')}</div>${tab === 'vet' ? '<div class="card"><b>Enlace para que se registren los veterinarios:</b><div class="url" style="margin:8px 0">' + location.origin + '/#/veterinario</div><button class="btn o" data-cp="1">Copiar enlace</button></div>' : ''}<div class="card"><div style="overflow-x:auto"><table>${body}</table></div></div>`;
  app.onclick = async e => {
    const d = e.target.dataset; let r;
    if (d.tab) { tab = d.tab; return admin(); }
    if (d.cp) return navigator.clipboard.writeText(location.origin + '/#/veterinario').then(() => alert('Enlace copiado'));
    if (d.qr) return qrModal(d.qr, d.n);
    if (d.plan) r = await sb.from('profiles').update({ plan: d.plan }).eq('id', d.id);
    if (d.blk) r = await sb.from('profiles').update({ blocked: d.blk === '1' }).eq('id', d.id);
    if (d.ok) r = await sb.from('user_roles').insert({ user_id: d.ok, role: 'vet' });
    if (d.rm && confirm('¿Quitar permisos de veterinario?')) r = await sb.from('user_roles').delete().eq('user_id', d.rm).eq('role', 'vet');
    if (d.del && confirm('¿Eliminar a "' + d.n + '" con todas sus mascotas y su historial? No se puede deshacer.') && prompt('Escribe ELIMINAR para confirmar') === 'ELIMINAR') r = await sb.rpc('admin_delete_user', { _uid: d.del });
    if (r) { if (r.error) alert(r.error.message); admin(); }
  };
}

function vetSignup() {
  app.innerHTML = `<div class="card narrow"><h2>Registro de veterinarios</h2><p>Verificaremos tu matrícula antes de habilitar tu cuenta.</p><form id="f">
  <input name="name" placeholder="Nombre completo" required><input name="phone" placeholder="Teléfono" required><input name="lic" placeholder="Matrícula profesional" required>
  <input name="clinic" placeholder="Clínica o veterinaria" required><input name="email" type="email" placeholder="Correo" required><input name="pw" type="password" minlength="6" placeholder="Contraseña" required>
  <button class="btn">Enviar solicitud</button></form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    if (!(await consent())) return;
    const r = await sb.auth.signUp({ email: f.get('email'), password: f.get('pw'), options: { data: { full_name: f.get('name'), wants_vet: true, vet_license: f.get('lic') } } });
    if (r.error) return alert(r.error.message);
    if (!r.data.session) return alert('Solicitud enviada. Confirma tu correo para continuar.');
    await sb.from('profiles').update({ phone: f.get('phone'), clinic: f.get('clinic') }).eq('id', r.data.user.id);
    alert('Solicitud enviada. Verificaremos tu matrícula.'); location.hash = '#/dashboard'; route();
  };
}

function forgotPage() {
  app.innerHTML = `<div class="card narrow"><h2>Recuperar contraseña</h2><p>Te enviaremos un enlace por correo.</p><form id="f"><input name="email" type="email" placeholder="Tu correo" required><button class="btn">Enviar enlace</button></form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const r = await sb.auth.resetPasswordForEmail(new FormData(e.target).get('email'), { redirectTo: location.origin + location.pathname });
    alert(r.error ? r.error.message : 'Si el correo está registrado, te enviamos un enlace. Revisa también la carpeta de no deseados.');
  };
}
function newPassPage() {
  app.innerHTML = `<div class="card narrow"><h2>Nueva contraseña</h2><form id="f"><input name="pw" type="password" minlength="6" placeholder="Nueva contraseña" required><button class="btn">Guardar</button></form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const r = await sb.auth.updateUser({ password: new FormData(e.target).get('pw') });
    if (r.error) return alert(r.error.message);
    window.__rec = false; alert('Contraseña actualizada.'); location.hash = '#/dashboard'; route();
  };
}
function privacyPage() {
  app.innerHTML = `<div class="card"><h2>Política de privacidad y términos</h2><p><small>Texto base. Última actualización: 2026.</small></p>
  <h3>Quién es responsable</h3><p>Vidriera Digital, Buenos Aires, Argentina. Contacto: tuvidrieradigital1@gmail.com.</p>
  <h3>Qué datos guardamos</h3><p>Tu nombre, correo y teléfono; en el plan Pro también tu dirección y ciudad. Los datos de tus mascotas (nombre, raza, color, alergias, foto y ficha de salud). Si alguien encuentra a tu mascota y comparte su ubicación, guardamos esa ubicación y el contacto que deje. Para mantener tu sesión iniciada usamos el almacenamiento de tu navegador; no usamos cookies de publicidad.</p>
  <h3>Qué se muestra al escanear el chip o el QR</h3><p>Cualquier persona que lo escanee ve el nombre de la mascota, sus datos básicos, tu nombre de pila y tu teléfono (para llamarte o escribirte por WhatsApp). La ficha de salud y tu dirección solo las ve el dueño. Al registrarte aceptas que tu teléfono sea visible de esta forma, y puedes cambiarlo o quitarlo desde tu perfil.</p>
  <h3>Tus derechos</h3><p>Puedes pedir acceso, corrección o eliminación de tus datos escribiendo al correo de contacto. Tratamos tus datos conforme a la Ley 25.326 de Protección de los Datos Personales de Argentina; el organismo de control es la Agencia de Acceso a la Información Pública.</p>
  <h3>Términos de uso</h3><p>El servicio es solo para mayores de 18 años. Pets Date es una ayuda para reencontrar mascotas y no garantiza su recuperación. Eres responsable de que tus datos sean correctos. Las funciones Pro se activan según el plan contratado. Podemos bloquear cuentas con uso indebido.</p></div>`;
}

addEventListener('hashchange', route); route();

const IC = {
  nfc: 'M8 9a5 5 0 0 1 0 6M12 7a9 9 0 0 1 0 10M16 5a13 13 0 0 1 0 14',
  qr: 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v.01M14 20h.01M20 20v.01M17 17v3h3',
  alarm: 'M7 18v-6a5 5 0 0 1 10 0v6M5 21h14M12 2v2M4.9 5l1.4 1.4M19.1 5l-1.4 1.4M3 12h2M19 12h2',
  syringe: 'M18 2l4 4M17 7l3-3M19 9L8.7 19.3a1 1 0 0 1-1.4 0l-2.6-2.6a1 1 0 0 1 0-1.4L15 5M9 11l4 4M5 19l-3 3M14 4l6 6',
  steth: 'M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1M8 15a6 6 0 0 0 12 0v-3M22 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0z',
  shield: 'M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6zM9 12l2 2 4-4',
  star: 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z',
  crown: 'M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5zM5 22h14' };
const ico = k => `<span class="ico"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg></span>`;
const FEAT = [['nfc', 'Chip NFC', 'Acerca cualquier celular al collar y se abre la ficha. Sin apps.'], ['qr', 'QR de respaldo', 'Para celulares sin NFC, un código QR en la insignia.'],
  ['alarm', 'Modo perdida', 'Un toque y quien lo encuentre te envía su ubicación. Plan Pro.'], ['syringe', 'Vacunas al día', 'Historial de vacunas con sus fechas y próxima dosis.'],
  ['steth', 'Para veterinarios', 'El veterinario verificado ve el historial completo. Plan Pro.'], ['shield', 'Privacidad', 'Un extraño solo ve lo básico. Tu dirección queda protegida.']];
const FAQ = [['¿Necesita batería el chip NFC?', 'No. Funciona sin batería ni cargador: se activa solo cuando acercas un celular.'],
  ['¿Funciona con cualquier celular?', 'La mayoría de los Android y los iPhone modernos leen NFC sin instalar nada. Si el celular no tiene NFC, se escanea el código QR de la misma insignia.'],
  ['¿La suscripción incluye la insignia con el chip?', 'No. La insignia con chip NFC y QR se vende por separado, con un pago único. Si se pierde o se daña, se reprograma y se vende una nueva.'],
  ['¿Pago algo por actualizar la información de mi mascota?', 'No. El chip solo guarda un enlace a la ficha: lo que cambies en tu cuenta se ve al instante al escanearlo, sin regrabar nada ni pagar de nuevo. En el plan Gratis puedes agregar vacunas y actualizar tu contacto; editar los demás datos de la mascota es del plan Pro.'],
  ['¿Tengo que pagar una mensualidad para usar el chip?', 'No. La insignia es de pago único y con el plan Gratis ya funciona. La mensualidad solo existe si quieres pasar al plan Pro.'],
  ['¿Mi veterinario puede ver la ficha?', 'Con el plan Pro, un veterinario verificado por Pets Date puede consultar el historial completo de tu mascota.'],
  ['¿Qué pasa si pierdo a mi mascota?', 'Con el plan Pro la marcas como perdida: quien escanee su insignia ve el aviso y puede tocar "La encontré". Recibes el aviso con sonido y su ubicación en el mapa mientras tienes la app abierta.'],
  ['¿Hay un plan gratis?', 'Sí. Incluye una mascota con su ficha de salud y vacunas, y tu teléfono visible para quien la encuentre.'],
  ['¿Qué datos ve un extraño al escanear?', 'Solo lo básico: el nombre y los datos de tu mascota, tu primer nombre y tu teléfono. Tu dirección y su ficha de salud quedan protegidas.'],
  ['¿Qué pasa cuando termina mi plan Pro?', 'Tu cuenta vuelve al plan Gratis. Conservas tus mascotas y su ficha, pero las funciones Pro se bloquean.'],
  ['¿Cómo contrato el plan Pro o compro la insignia?', 'Escríbenos por WhatsApp y coordinamos.']];
function home() {
  const wa = (typeof WHATSAPP !== 'undefined' && WHATSAPP) ? `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola, quiero consultar por la insignia NFC de Pets Date')}">💬 Consultar por WhatsApp</a>` : '';
  app.innerHTML = `<div class="hero"><div><span class="pill">¡Guau! ¡Miau! ¡Hola!</span>
  <h1>Su historia,<br><span class="out">en su collar.</span></h1>
  <p class="lead">Pets Date guarda la ficha de tu perro o gato en un chip NFC. Un toque con el celular y aparece todo: quién es, quién lo cuida, sus vacunas y su salud.</p>
  <div class="row"><a class="btn big" href="#/${user ? 'dashboard' : 'registro'}">Crear la ficha de mi mascota</a><button class="btn o big" onclick="document.getElementById('como').scrollIntoView({behavior:'smooth'})">Cómo funciona</button></div></div>
  <div class="pic"><div class="burst"></div><img src="pets-date-logo.png" alt="Cachorro y gatito abrazados"></div></div>
  <section class="sec"><h2>Todo lo que lleva su insignia NFC/QR</h2><div class="grid">${FEAT.map(f => `<div class="card feat">${ico(f[0])}<h3>${f[1]}</h3><p>${f[2]}</p></div>`).join('')}</div></section>
  <section class="sec" id="como"><h2>Así funciona Pets Date</h2><div class="grid">
  <div class="card step"><span class="num">1</span><h3>Registra a tu mascota</h3><p>Crea tu cuenta gratis y completa su ficha: datos, vacunas y tu contacto.</p></div>
  <div class="card step"><span class="num">2</span><h3>Ponle su insignia</h3><p>La insignia con chip NFC y QR va en el collar. Se vende por separado, con pago único.</p></div>
  <div class="card step"><span class="num">3</span><h3>Quien la encuentre, escanea</h3><p>Con un toque o un escaneo ve su ficha y puede llamarte o avisarte.</p></div></div></section>
  <section class="sec"><h2>Planes</h2><div class="grid">
  <div class="card plan">${ico('star')}<h3>Gratis</h3><p class="pdesc">Explora la plataforma y registra tu primera mascota sin costo</p><div class="price"><b>$0</b> USD</div><ul><li>1 mascota con su ficha</li><li>Agregar vacunas y actualizar tu contacto</li><li>Tu teléfono visible al escanear</li><li class="no">Sin modo perdida, fotos, edición ni acceso de veterinarios</li></ul></div>
  <div class="card plan">${ico('crown')}<h3>Pro</h3><p class="pdesc">Incluye funciones avanzadas de edición y todo lo necesario para encontrar a tu mascota</p><div class="price"><b>$8,50</b> USD/mes</div><ul><li>Varias mascotas</li><li>Foto de cada mascota</li><li>Editar y borrar cuando quieras</li><li>Modo perdida con aviso sonoro y mapa</li><li>Tu veterinario verificado puede ver el historial completo</li><li>Dirección y ciudad en tu perfil</li></ul></div></div>
  <p class="note"><b>Importante:</b> ningún plan incluye la insignia con chip NFC y QR. Se vende por separado, con un pago único. Si se pierde o se daña, se reprograma y se vende una nueva.</p>${wa ? `<div class="row">${wa}</div>` : ''}</section>
  <section class="sec"><h2>Así se ve la insignia</h2><img src="insignia.webp" alt="Insignia NFC y QR de Pets Date" style="display:block;margin:auto;width:min(100%,720px);height:auto;border:2.5px solid var(--ink);border-radius:16px" onerror="this.closest('section').remove()"><p style="text-align:center;margin:8px 0 0"><small>Imagen ilustrativa. Frente: chip NFC · Reverso: código QR de respaldo</small></p></section>
  <section class="sec"><h2>Preguntas frecuentes</h2>${FAQ.map(q => `<details class="card"><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</section>`;
}

function consent() {
  return new Promise(ok => {
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = `<div class="card"><h2 class="disp">Términos de Servicio y Política de Privacidad</h2>
    <p style="text-align:left">Al pulsar en «Aceptar y continuar», aceptas los <a href="#/privacidad" target="_blank">Términos del Servicio</a> y reconoces que leíste la <a href="#/privacidad" target="_blank">Política de Privacidad</a> para saber cómo recopilamos, usamos y compartimos tus datos.</p>
    <p class="note" style="text-align:left">⚠️ <b>Solo para mayores de 18 años.</b> Al continuar confirmas que tienes 18 años o más. Si eres menor de edad, pídele a un adulto que cree la cuenta.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="ca">Aceptar y continuar</button><button class="btn o" id="cc">Cancelar</button></div></div>`;
    document.body.append(d);
    d.querySelector('#ca').onclick = () => { d.remove(); ok(true); };
    d.querySelector('#cc').onclick = () => { d.remove(); ok(false); };
  });
}
function authPage(mode) {
  const up = mode === 'up';
  app.innerHTML = `<div class="card narrow big"><h2 class="disp">${up ? 'Crea tu cuenta' : '¡Hola de nuevo!'}</h2><form id="f">
  ${up ? '<label>Nombre completo<input name="name" required></label>' : ''}
  <label>Correo<input name="email" type="email" required></label>
  <label>Contraseña<input name="pw" type="password" minlength="6" required></label>
  ${up ? '<p style="font-size:.9rem;margin:0 0 12px">Solo para mayores de 18 años.</p>' : ''}
  <button class="btn wide">${up ? 'Crear cuenta' : 'Ingresar'}</button></form>
  ${(typeof GOOGLE_LOGIN !== 'undefined' && GOOGLE_LOGIN) ? '<p class="or">o</p><button class="btn o wide" id="gg">Continuar con Google</button>' : ''}
  <p style="text-align:center"><a href="#" id="sw">${up ? 'Ya tengo cuenta' : '¿No tienes cuenta? Regístrate'}</a></p>${up ? '' : '<p style="text-align:center"><a href="#/olvide">Olvidé mi contraseña</a></p>'}</div>`;
  $('#sw').onclick = e => { e.preventDefault(); authPage(up ? 'in' : 'up'); };
  if ($('#gg')) $('#gg').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
  $('#f').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    if (up && !(await consent())) return;
    const r = up
      ? await sb.auth.signUp({ email: f.get('email'), password: f.get('pw'), options: { data: { full_name: f.get('name') } } })
      : await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('pw') });
    if (r.error) return alert(r.error.message);
    if (up && !r.data.session) return alert('Cuenta creada. Revisa tu correo para confirmarla.');
    location.hash = '#/dashboard'; route();
  };
}

async function dash() {
  if (!user) { location.hash = '#/auth'; return; }
  const me = window.me || {}, pro = me.plan === 'pro';
  if (me.wants_vet && !window.isVet && !window.isAdmin) { app.innerHTML = '<div class="card narrow"><h2>Cuenta en revisión</h2><p>Estamos verificando tu matrícula. Te habilitaremos apenas termine la verificación.</p></div>'; return; }
  if (me.blocked) { app.innerHTML = '<div class="card narrow"><h2>Cuenta bloqueada</h2><p>Comunícate con Vidriera Digital.</p></div>'; return; }
  let [{ data: pets }, { data: pr }] = await Promise.all([
    sb.from('pets').select('*,sightings(*)').eq('owner_id', user.id).order('created_at'),
    sb.from('profiles').select('*').eq('id', user.id).maybeSingle()]);
  pr = pr || {}; pets = pets || [];
  const canAdd = pro || !pets.length;
  app.innerHTML = `<h2>Mis mascotas <small>Plan ${pro ? 'Pro' : 'Gratis'}</small></h2>${pro ? '<div class="row" style="margin:0 0 14px"><button class="btn o" id="snd">🔔 Probar alerta con sonido</button><input type="file" id="ph" accept="image/*" hidden></div>' : ''}<div class="grid">${pets.map(p => `<div class="card">
  ${p.photo_url ? `<img src="${esc(p.photo_url)}" alt="" style="width:100%;max-height:200px;object-fit:cover;border:2.5px solid var(--ink);border-radius:12px;margin-bottom:8px">` : ''}<h3>${esc(p.name)} <small>${esc(p.species)}</small></h3><p>${esc(p.breed)} ${esc(p.color)}</p>${p.is_lost ? '<b class="lost">PERDIDA</b>' : ''}
  ${pro ? p.sightings.map(s => `<p>📍 ${new Date(s.created_at).toLocaleString()} – ${esc(s.message)} ${esc(s.contact)} ${s.lat ? `<a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener">mapa</a>` : ''}</p>`).join('') : ''}
  <div class="row"><a class="btn o" href="#/pet/${p.tag_code}">Ver ficha</a>
  ${pro ? `<button class="btn o" data-lost="${p.id}" data-v="${!p.is_lost}">${p.is_lost ? 'Ya apareció' : 'Marcar perdida'}</button><button class="btn o" data-ed="${p.id}">Editar</button><button class="btn o" data-ph="${p.id}">📷 Foto</button><button class="btn r" data-del="${p.id}">Borrar</button>`
  : '<button class="btn o" data-lock="1">🔒 Perdida y foto · solo Pro</button>'}</div></div>`).join('')}</div>
  <div class="grid">${canAdd ? `<form class="card" id="np"><h3>Agregar mascota</h3><input name="name" placeholder="Nombre" required>
  <select name="species"><option>perro</option><option>gato</option><option>otro</option></select><input name="breed" placeholder="Raza"><input name="color" placeholder="Color"><input name="allergies" placeholder="Alergias">
  <button class="btn">Guardar mascota</button></form>` : '<div class="card"><h3>Agregar mascota</h3><p>🔒 El plan gratuito incluye una mascota. Pasa a Pro para agregar más.</p></div>'}
  <form class="card" id="pf"><h3>Mi contacto (se muestra al escanear)</h3><p><small>Quien escanee verá tu primer nombre y tu teléfono. Tu dirección es privada.</small></p><input name="full_name" placeholder="Nombre" value="${esc(pr.full_name)}">
  <input name="phone" placeholder="Teléfono con código de país" value="${esc(pr.phone)}">
  ${pro ? `<input name="address" placeholder="Dirección" value="${esc(pr.address)}"><input name="city" placeholder="Ciudad" value="${esc(pr.city)}">` : '<p>🔒 Dirección y ciudad: solo Pro.</p>'}
  <button class="btn">Guardar contacto</button></form></div>`;
  if ($('#np')) $('#np').onsubmit = async e => {
    e.preventDefault();
    if (!pro && !confirm('¿Estás seguro de que los datos son correctos?\n\nEn la versión gratuita, una vez guardados no podrás modificarlos ni eliminarlos. En la versión Pro puedes editarlos cuando quieras.')) return;
    const r = await sb.from('pets').insert(Object.fromEntries(new FormData(e.target))); r.error ? alert(r.error.message) : dash();
  };
  $('#pf').onsubmit = async e => { e.preventDefault(); const r = await sb.from('profiles').update(Object.fromEntries(new FormData(e.target))).eq('id', user.id); alert(r.error ? r.error.message : 'Contacto guardado'); };
  if ($('#snd')) $('#snd').onclick = () => { beep(); navigator.vibrate && navigator.vibrate(300); };
  if ($('#ph')) $('#ph').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const blob = await shrink(f), path = user.id + '/' + window.__ph + '.jpg';
      const up = await sb.storage.from('pet-photos').upload(path, blob, { upsert: true, contentType: 'image/jpeg' }); if (up.error) return alert(up.error.message);
      const url = sb.storage.from('pet-photos').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
      const r = await sb.from('pets').update({ photo_url: url }).eq('id', window.__ph); r.error ? alert(r.error.message) : dash();
    } catch (err) { alert(err.message); }
  };
  app.onclick = async e => {
    const d = e.target.dataset;
    if (d.lock) alert('Función disponible en la versión Pro.');
    if (d.ph) { window.__ph = d.ph; $('#ph').click(); }
    if (d.lost && (d.v !== 'true' || confirm('¿Marcar a tu mascota como perdida? Se mostrará un aviso a quien escanee su chip.'))) { await sb.from('pets').update({ is_lost: d.v === 'true' }).eq('id', d.lost); dash(); }
    if (d.ed) { const p = pets.find(x => x.id === d.ed), u = {}; for (const [k, t] of [['name', 'Nombre'], ['breed', 'Raza'], ['color', 'Color'], ['allergies', 'Alergias']]) { const v = prompt(t + ':', p[k] || ''); if (v === null) return; u[k] = v; } await sb.from('pets').update(u).eq('id', d.ed); dash(); }
    if (d.del && confirm('¿Borrar esta mascota y su historial?')) { await sb.from('pets').delete().eq('id', d.del); dash(); }
  };
}

function qrModal(code, name) {
  const url = location.origin + location.pathname + '#/pet/' + code;
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const svg = q.createSvgTag(6, 4);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><h3>${esc(name)}</h3>${svg}<p>Enlace para el chip NFC y el QR:</p><div class="url">${esc(url)}</div>
  <div class="row"><button class="btn" id="dl">Descargar QR</button><button class="btn o" id="cp">Copiar enlace</button><button class="btn o" onclick="print()">Imprimir</button><button class="btn r" id="cl">Cerrar</button></div></div>`;
  document.body.append(m);
  $('#cl').onclick = () => m.remove();
  $('#cp').onclick = () => navigator.clipboard.writeText(url).then(() => alert('Enlace copiado'));
  $('#dl').onclick = () => {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 800; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 800, 800); x.drawImage(img, 0, 0, 800, 800);
      c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'qr-' + code + '.png'; document.body.append(a); a.click(); a.remove(); }); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  };
}

async function petPage(code) {
  const { data: p } = await sb.rpc('get_public_pet', { _code: code });
  if (!p) { app.innerHTML = '<div class="card narrow"><h2>Mascota no encontrada</h2></div>'; return; }
  let full = null;
  if (p.is_owner || p.is_vet) full = (await sb.rpc('get_full_pet', { _code: code })).data;
  const tel = String(p.owner_phone || '').replace(/\D/g, '');
  app.innerHTML = `<div class="card narrow">${p.is_lost ? `<b class="lost">¡ME PERDÍ! ${esc(p.lost_message)} ${p.reward ? 'Recompensa: ' + esc(p.reward) : ''}</b>` : ''}
  <div class="pic" style="width:60%"><img src="${esc(p.photo_url || 'pets-date-logo.png')}" alt="${esc(p.name)}" style="animation:none"></div>
  <h2>${esc(p.name)} <small>${esc(p.species)} ${esc(p.breed)}</small></h2>
  <p>Color: ${esc(p.color)}<br>Alergias: ${esc(p.allergies) || 'ninguna registrada'}</p>
  <p><b>Familia:</b> ${esc(p.owner_name)}</p>
  ${tel ? `<div class="row"><a class="btn" href="tel:+${tel}">Llamar</a><a class="btn o" href="https://wa.me/${tel}" target="_blank" rel="noopener">WhatsApp</a></div>` : ''}
  ${p.is_lost ? `<details style="margin-top:14px"><summary class="btn o">La encontré / la vi</summary><form id="sf" style="margin-top:10px">
  <textarea name="m" placeholder="¿Dónde y cómo está?" required></textarea><input name="c" placeholder="Tu teléfono o contacto"><button type="button" class="btn o" id="geo">📍 Compartir mi ubicación</button> <small id="gs">Así el dueño ve en el mapa dónde estás.</small><div class="row"><button class="btn">Avisar al dueño</button></div></form></details>` : ''}</div>
  ${full ? `<div class="card"><h3>Ficha de salud</h3><p>Dueño: ${esc(full.owner?.full_name)} · ${esc(full.owner?.phone)} · ${esc(full.owner?.address)} ${esc(full.owner?.city)}</p>
  <table><tr><th>Vacuna</th><th>Aplicada</th><th>Próxima</th></tr>${full.vaccines.map(v => `<tr><td>${esc(v.name)}</td><td>${esc(v.applied_on)}</td><td>${esc(v.next_due)}</td></tr>`).join('')}</table>
  <p><b>Condiciones:</b> ${full.conditions.map(c => esc(c.name) + ' (' + esc(c.status) + ')').join(', ') || 'ninguna'}</p>
  ${p.is_owner ? `<form id="vf"><input name="name" placeholder="Nueva vacuna" required><input name="applied_on" type="date"><input name="next_due" type="date"><button class="btn">Agregar vacuna</button></form>` : ''}</div>` : ''}`;
  window.__pos = null;
  if ($('#geo')) $('#geo').onclick = () => {
    const st = $('#gs'); st.textContent = 'Buscando ubicación…';
    if (!navigator.geolocation) { st.textContent = 'Este navegador no permite compartir ubicación.'; return; }
    navigator.geolocation.getCurrentPosition(pos => { window.__pos = pos; st.textContent = '✅ Ubicación lista'; },
      er => { st.textContent = er.code === 1 ? 'Permiso denegado. Toca el ícono a la izquierda de la dirección web → Permisos → Ubicación → Permitir, y vuelve a intentar.' : er.code === 3 ? 'Tardó demasiado. Activa el GPS e intenta de nuevo.' : 'No se pudo obtener la ubicación. Activa el GPS del celular.'; },
      { enableHighAccuracy: true, timeout: 15000 });
  };
  if ($('#sf')) $('#sf').onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    const go = pos => sb.rpc('report_sighting', { _code: code, _lat: pos?.coords.latitude ?? null, _lng: pos?.coords.longitude ?? null, _message: f.get('m'), _contact: f.get('c') })
      .then(r => alert(r.error ? r.error.message : '¡Gracias! Ya avisamos a la familia.'));
    if (!window.__pos && !confirm('No compartiste tu ubicación, así que el dueño no verá el mapa. ¿Enviar de todos modos?')) return;
    go(window.__pos);
  };
  if ($('#vf')) $('#vf').onsubmit = async e => {
    e.preventDefault(); const o = Object.fromEntries(new FormData(e.target));
    o.applied_on ||= null; o.next_due ||= null; o.pet_id = full.pet.id;
    const r = await sb.from('vaccines').insert(o); r.error ? alert(r.error.message) : petPage(code);
  };
}
</script>
</body>
</html>
