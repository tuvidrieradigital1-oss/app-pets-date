<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pets Date</title>
<link rel="icon" href="pets-date-logo.png">
<style>
:root{--ink:#2b2118;--bg:#fdf3dc;--card:#fffaf0;--pri:#f28c28;--sec:#3fbfc4;--red:#e5484d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(rgba(43,33,24,.09) 1.2px,transparent 1.2px) 0 0/18px 18px var(--bg);color:var(--ink);font-family:"Fredoka",ui-rounded,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2.5px solid var(--ink);padding-top:env(safe-area-inset-top,0)}
.bar{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px}
.logo{display:flex;align-items:center;gap:8px;font-size:1.5rem;font-weight:700;color:var(--ink);text-decoration:none}
.logo img{width:44px;height:44px}.logo span,h1 span{color:var(--pri)}
nav{display:flex;gap:8px;align-items:center}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}
.btn{display:inline-block;background:var(--pri);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
.btn.o{background:var(--card)}.btn.r{background:var(--red);color:#fff}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:16px;margin:0 0 16px;box-shadow:4px 4px 0 var(--ink)}
.narrow{max-width:440px;margin:20px auto}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;margin:0 0 10px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:10px}.chk input{width:auto;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:center;padding-top:10px}
h1{font-size:clamp(2.4rem,8vw,4rem);margin:0 0 10px}
.pic{position:relative;width:min(92vw,448px);margin:auto}
.burst{position:absolute;inset:5.4%;background:var(--sec);clip-path:polygon(50% 0%,61% 18%,82% 8%,78% 30%,100% 35%,82% 50%,100% 65%,78% 70%,82% 92%,61% 82%,50% 100%,39% 82%,18% 92%,22% 70%,0% 65%,18% 50%,0% 35%,22% 30%,18% 8%,39% 18%)}
.pic img{position:relative;display:block;width:100%;filter:drop-shadow(0 20px 13px rgba(0,0,0,.12));animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.pic img{animation:none}}
.lost{display:block;background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px;text-align:center;font-weight:700;margin-bottom:14px}
small{opacity:.7;font-weight:400}
.foot{text-align:center;font-weight:700;margin:0;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal .card{max-width:380px;width:100%;text-align:center;margin:0}.modal svg{width:100%;height:auto;max-width:280px}
.url{word-break:break-all;font-size:.8rem;background:#fff;border:2px dashed var(--ink);border-radius:8px;padding:6px}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #0002;padding:4px;text-align:left;font-size:.9rem}
@media print{body *{visibility:hidden}.modal,.modal *{visibility:visible}.modal{background:#fff;position:absolute}.row{display:none}}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#/"><img src="pets-date-logo.png" alt="Pets Date">Pets <span>Date</span></a><nav id="nav"></nav></div></header>
<main id="app"></main>
<footer class="foot">App desarrollada por Vidriera Digital<br>Todos los derechos reservados · Buenos Aires, Argentina · 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// 1) PEGA AQUI los datos de TU proyecto Supabase (Project Settings > API)
const SUPABASE_URL = "https://bpvkvsczojzlpupwtqje.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwdmt2c2N6b2p6bHB1cHd0cWplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4OTQ2MjEsImV4cCI6MjEwOTQ3MDYyMX0.JQxbPw3PoC9170eJC5qB_UU-M7E9UoBKBEcaSbuE6zQ";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user = null;

async function route() {
  const { data: { session } } = await sb.auth.getSession();
  user = session?.user || null;
  let isAdmin = false;
  if (user) { const { data: rl } = await sb.from('user_roles').select('role').eq('user_id', user.id); isAdmin = !!rl?.some(r => r.role === 'admin'); }
  window.isAdmin = isAdmin;
  $('#nav').innerHTML = user
    ? '<a class="btn o" href="#/dashboard">Mis mascotas</a>' + (isAdmin ? '<a class="btn o" href="#/admin">Admin</a>' : '') + '<button class="btn o" id="out">Salir</button>'
    : '<a class="btn" href="#/auth">Ingresar</a>';
  if ($('#out')) $('#out').onclick = async () => { await sb.auth.signOut(); location.hash = '#/auth'; route(); };
  const h = location.hash.slice(1) || '/';
  if (h.startsWith('/pet/')) return petPage(decodeURIComponent(h.slice(5)));
  ({ '/': home, '/auth': () => authPage('in'), '/dashboard': dash, '/admin': admin }[h] || home)();
}

async function admin() {
  if (!window.isAdmin) { app.innerHTML = '<div class="card narrow"><h2>Solo para administradores</h2></div>'; return; }
  const [{ data: ps }, { data: rs }] = await Promise.all([
    sb.from('profiles').select('id,full_name,phone,wants_vet,vet_license,created_at').order('created_at', { ascending: false }),
    sb.from('user_roles').select('user_id,role')]);
  const vets = new Set((rs || []).filter(r => r.role === 'vet').map(r => r.user_id));
  app.innerHTML = `<h2>Panel de administrador</h2><div class="card"><p>${ps.length} usuarios · ${vets.size} veterinarios aprobados</p>
  <div style="overflow-x:auto"><table><tr><th>Nombre</th><th>Teléfono</th><th>Matrícula</th><th>Alta</th><th></th></tr>
  ${ps.map(p => `<tr><td>${esc(p.full_name) || '(sin nombre)'}${p.wants_vet ? ' 🩺' : ''}${vets.has(p.id) ? ' <small>(vet)</small>' : ''}</td><td>${esc(p.phone)}</td><td>${esc(p.vet_license)}</td>
  <td>${new Date(p.created_at).toLocaleDateString()}</td>
  <td><div class="row" style="margin:0">${vets.has(p.id) ? `<button class="btn o" data-rm="${p.id}">Quitar vet</button>` : `<button class="btn" data-ok="${p.id}">Aprobar vet</button>`}
  ${p.id === user.id ? '<small>(tú)</small>' : `<button class="btn r" data-del="${p.id}" data-n="${esc(p.full_name) || 'sin nombre'}">Eliminar</button>`}</div></td></tr>`).join('')}</table></div></div>`;
  app.onclick = async e => {
    const d = e.target.dataset; let r;
    if (d.ok) r = await sb.from('user_roles').insert({ user_id: d.ok, role: 'vet' });
    if (d.rm && confirm('¿Quitar permisos de veterinario?')) r = await sb.from('user_roles').delete().eq('user_id', d.rm).eq('role', 'vet');
    if (d.del && confirm('¿Eliminar a "' + d.n + '" con todas sus mascotas y su historial? No se puede deshacer.') && prompt('Escribe ELIMINAR para confirmar') === 'ELIMINAR')
      r = await sb.rpc('admin_delete_user', { _uid: d.del });
    if (r) { if (r.error) alert(r.error.message); admin(); }
  };
}
addEventListener('hashchange', route); route();

function home() {
  app.innerHTML = `<div class="hero"><div><h1>Pets <span>Date</span></h1>
  <p>La identidad digital de tu mascota. Con un toque NFC o un escaneo QR en su collar, quien la encuentre ve su ficha y te avisa al instante.</p>
  <a class="btn" href="#/${user ? 'dashboard' : 'auth'}">${user ? 'Mis mascotas' : 'Crear cuenta gratis'}</a></div>
  <div class="pic"><div class="burst"></div><img src="pets-date-logo.png" alt="Cachorro y gatito abrazados"></div></div>`;
}

function authPage(mode) {
  const up = mode === 'up';
  app.innerHTML = `<div class="card narrow"><h2>${up ? 'Crear cuenta' : 'Ingresar'}</h2><form id="f">
  ${up ? '<input name="name" placeholder="Nombre completo" required>' : ''}
  <input name="email" type="email" placeholder="Correo" required>
  <input name="pw" type="password" minlength="6" placeholder="Contraseña" required>
  <button class="btn">${up ? 'Registrarme' : 'Entrar'}</button></form>
  <p><a href="#" id="sw">${up ? 'Ya tengo cuenta' : 'No tengo cuenta, quiero registrarme'}</a></p></div>`;
  $('#sw').onclick = e => { e.preventDefault(); authPage(up ? 'in' : 'up'); };
  $('#f').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    const r = up
      ? await sb.auth.signUp({ email: f.get('email'), password: f.get('pw'), options: { data: { full_name: f.get('name'), wants_vet: !!f.get('vet'), vet_license: f.get('lic') || '' } } })
      : await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('pw') });
    if (r.error) return alert(r.error.message);
    if (up && !r.data.session) return alert('Cuenta creada. Revisa tu correo para confirmarla.');
    location.hash = '#/dashboard'; route();
  };
}

async function dash() {
  if (!user) { location.hash = '#/auth'; return; }
  let [{ data: pets }, { data: pr }] = await Promise.all([
    sb.from('pets').select('*,sightings(*)').order('created_at'),
    sb.from('profiles').select('*').eq('id', user.id).maybeSingle()]);
  pr = pr || {};
  app.innerHTML = `<h2>Mis mascotas</h2><div class="grid">${(pets || []).map(p => `<div class="card">
  <h3>${esc(p.name)} <small>${esc(p.species)}</small></h3><p>${esc(p.breed)} ${esc(p.color)}</p>
  ${p.is_lost ? '<b class="lost">PERDIDA</b>' : ''}
  ${p.sightings.map(s => `<p>📍 ${new Date(s.created_at).toLocaleString()} – ${esc(s.message)} ${esc(s.contact)}
  ${s.lat ? `<a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener">mapa</a>` : ''}</p>`).join('')}
  <div class="row"><a class="btn o" href="#/pet/${p.tag_code}">Ver ficha</a>
  <button class="btn o" data-qr="${p.tag_code}" data-n="${esc(p.name)}">QR / NFC</button>
  <button class="btn o" data-lost="${p.id}" data-v="${!p.is_lost}">${p.is_lost ? 'Ya apareció' : 'Marcar perdida'}</button>
  <button class="btn r" data-del="${p.id}">Borrar</button></div></div>`).join('')}</div>
  <div class="grid"><form class="card" id="np"><h3>Agregar mascota</h3><input name="name" placeholder="Nombre" required>
  <select name="species"><option>perro</option><option>gato</option><option>otro</option></select>
  <input name="breed" placeholder="Raza"><input name="color" placeholder="Color"><input name="allergies" placeholder="Alergias">
  <button class="btn">Guardar mascota</button></form>
  <form class="card" id="pf"><h3>Mi perfil (se muestra al escanear)</h3><input name="full_name" placeholder="Nombre" value="${esc(pr.full_name)}">
  <input name="phone" placeholder="Teléfono con código de país" value="${esc(pr.phone)}"><input name="address" placeholder="Dirección" value="${esc(pr.address)}">
  <input name="city" placeholder="Ciudad" value="${esc(pr.city)}"><button class="btn">Guardar perfil</button></form></div>`;
  $('#np').onsubmit = async e => { e.preventDefault(); const r = await sb.from('pets').insert(Object.fromEntries(new FormData(e.target))); r.error ? alert(r.error.message) : dash(); };
  $('#pf').onsubmit = async e => { e.preventDefault(); const r = await sb.from('profiles').update(Object.fromEntries(new FormData(e.target))).eq('id', user.id); alert(r.error ? r.error.message : 'Perfil guardado'); };
  app.onclick = async e => {
    const d = e.target.dataset;
    if (d.qr) qrModal(d.qr, d.n);
    if (d.lost) { await sb.from('pets').update({ is_lost: d.v === 'true' }).eq('id', d.lost); dash(); }
    if (d.del && confirm('¿Borrar esta mascota y su historial?')) { await sb.from('pets').delete().eq('id', d.del); dash(); }
  };
}

function qrModal(code, name) {
  const url = location.origin + location.pathname + '#/pet/' + code;
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const svg = q.createSvgTag(6, 4);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><h3>${name}</h3>${svg}<p>Este enlace va en el chip NFC y en el QR:</p><div class="url">${esc(url)}</div>
  <div class="row"><a class="btn" download="qr-${code}.svg" href="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}">Descargar QR</a>
  <button class="btn o" id="cp">Copiar enlace</button><button class="btn o" onclick="print()">Imprimir</button><button class="btn r" id="cl">Cerrar</button></div></div>`;
  document.body.append(m);
  $('#cl').onclick = () => m.remove();
  $('#cp').onclick = () => navigator.clipboard.writeText(url).then(() => alert('Enlace copiado'));
}

async function petPage(code) {
  const { data: p } = await sb.rpc('get_public_pet', { _code: code });
  if (!p) { app.innerHTML = '<div class="card narrow"><h2>Mascota no encontrada</h2></div>'; return; }
  let full = null;
  if (p.is_owner || p.is_vet) full = (await sb.rpc('get_full_pet', { _code: code })).data;
  const tel = String(p.owner_phone || '').replace(/\D/g, '');
  app.innerHTML = `<div class="card narrow">${p.is_lost ? `<b class="lost">¡ME PERDÍ! ${esc(p.lost_message)} ${p.reward ? 'Recompensa: ' + esc(p.reward) : ''}</b>` : ''}
  <div class="pic" style="width:60%"><img src="${esc(p.photo_url || 'pets-date-logo.png')}" alt="${esc(p.name)}" style="animation:none"></div>
  <h2>${esc(p.name)} <small>${esc(p.species)} ${esc(p.breed)}</small></h2>
  <p>Color: ${esc(p.color)}<br>Alergias: ${esc(p.allergies) || 'ninguna registrada'}</p>
  <p><b>Familia:</b> ${esc(p.owner_name)}</p>
  ${tel ? `<div class="row"><a class="btn" href="tel:+${tel}">Llamar</a><a class="btn o" href="https://wa.me/${tel}" target="_blank" rel="noopener">WhatsApp</a></div>` : ''}
  <details style="margin-top:14px"><summary class="btn o">La encontré / la vi</summary><form id="sf" style="margin-top:10px">
  <textarea name="m" placeholder="¿Dónde y cómo está?" required></textarea><input name="c" placeholder="Tu teléfono o contacto"><button class="btn">Avisar al dueño</button></form></details></div>
  ${full ? `<div class="card"><h3>Ficha de salud</h3><p>Dueño: ${esc(full.owner?.full_name)} · ${esc(full.owner?.phone)} · ${esc(full.owner?.address)} ${esc(full.owner?.city)}</p>
  <table><tr><th>Vacuna</th><th>Aplicada</th><th>Próxima</th></tr>${full.vaccines.map(v => `<tr><td>${esc(v.name)}</td><td>${esc(v.applied_on)}</td><td>${esc(v.next_due)}</td></tr>`).join('')}</table>
  <p><b>Condiciones:</b> ${full.conditions.map(c => esc(c.name) + ' (' + esc(c.status) + ')').join(', ') || 'ninguna'}</p>
  <form id="vf"><input name="name" placeholder="Nueva vacuna" required><input name="applied_on" type="date"><input name="next_due" type="date"><button class="btn">Agregar vacuna</button></form></div>` : ''}`;
  $('#sf').onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    const go = pos => sb.rpc('report_sighting', { _code: code, _lat: pos?.coords.latitude ?? null, _lng: pos?.coords.longitude ?? null, _message: f.get('m'), _contact: f.get('c') })
      .then(r => alert(r.error ? r.error.message : '¡Gracias! Ya avisamos a la familia.'));
    navigator.geolocation ? navigator.geolocation.getCurrentPosition(go, () => go(null), { timeout: 8000 }) : go(null);
  };
  if ($('#vf')) $('#vf').onsubmit = async e => {
    e.preventDefault(); const o = Object.fromEntries(new FormData(e.target));
    o.applied_on ||= null; o.next_due ||= null; o.pet_id = full.pet.id;
    const r = await sb.from('vaccines').insert(o); r.error ? alert(r.error.message) : petPage(code);
  };
}
</script>
</body>
</html>
